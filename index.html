<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cotizador Express</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --color-primario: #1E3A8A;
      --color-secundario: #F59E0B;
    }
    .bg-brand-primary { background-color: var(--color-primario); }
    .text-brand-primary { color: var(--color-primario); }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans antialiased pb-10">

  <!-- PANTALLA 1: LOGIN -->
  <div id="screen-login" class="min-h-screen flex flex-col justify-center items-center px-4">
    <div class="w-full max-w-sm bg-white rounded-2xl shadow-xl p-6 text-center space-y-6">
      <div id="logo-container" class="flex justify-center mb-2">
        <div class="w-16 h-16 bg-slate-200 rounded-full flex items-center justify-center text-slate-400">
          <i class="fa-solid fa-screwdriver-wrench text-2xl"></i>
        </div>
      </div>
      <div>
        <h1 id="app-title" class="text-xl font-bold text-slate-800">Cotizador Express</h1>
        <p class="text-xs text-slate-500 mt-1">Ingresa tu PIN de acceso</p>
      </div>
      <div class="space-y-4">
        <input id="pin-input" type="password" maxlength="6" pattern="\d*" inputmode="numeric" placeholder="••••" 
               class="w-full text-center text-3xl tracking-widest font-bold py-3 border-2 border-slate-200 rounded-xl focus:border-brand-primary focus:outline-none transition">
        <button onclick="handleLogin()" id="btn-login" class="w-full bg-brand-primary text-white py-3.5 rounded-xl font-semibold shadow-lg hover:opacity-90 transition active:scale-95">
          Ingresar
        </button>
      </div>
      <p id="login-error" class="text-xs text-red-500 font-medium hidden"></p>
    </div>
  </div>

  <!-- PANTALLA 2: CAPTURA -->
  <div id="screen-app" class="hidden max-w-md mx-auto">
    <header class="bg-brand-primary text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center rounded-b-2xl">
      <span class="font-bold text-lg" id="nav-brand-name">Cotizador</span>
      <span id="user-badge" class="text-xs bg-white/20 px-2.5 py-1 rounded-full font-medium">Trabajador</span>
    </header>

    <main class="p-4 space-y-5">
      <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
        <h2 class="text-sm font-bold text-slate-700">1. Datos del Cliente</h2>
        <input id="cli-nombre" type="text" placeholder="Nombre completo *" class="w-full p-3 border rounded-xl text-sm">
        <div class="grid grid-cols-2 gap-2">
          <input id="cli-tel" type="tel" placeholder="Teléfono" class="p-3 border rounded-xl text-sm">
          <input id="cli-correo" type="email" placeholder="Correo" class="p-3 border rounded-xl text-sm">
        </div>
        <input id="cli-proyecto" type="text" placeholder="Tipo de proyecto" class="w-full p-3 border rounded-xl text-sm">
      </section>

      <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="text-sm font-bold text-slate-700">2. Materiales</h2>
          <button onclick="agregarFilaMaterial()" class="text-xs bg-slate-100 font-semibold px-3 py-1.5 rounded-lg">+ Agregar</button>
        </div>
        <div id="lista-materiales" class="space-y-2"></div>
      </section>

      <section class="bg-slate-900 text-white rounded-2xl p-5 shadow-lg space-y-3">
        <div class="flex justify-between text-xl font-bold">
          <span>Total Cliente:</span>
          <span id="lbl-total-cliente" class="text-emerald-400">$0.00</span>
        </div>
      </section>

      <button id="btn-guardar" onclick="enviarCotizacion()" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-bold shadow-lg">
        Guardar Cotización
      </button>
    </main>
  </div>

  <script>
    // INSERTA AQUÍ TU URL DE GOOGLE APPS SCRIPT
    const GAS_API_URL = "PEGA_AQUI_TU_URL_DE_APPS_SCRIPT";

    let globalConfig = {};
    let globalCatalogos = { materiales: [], actividades: [] };
    let usuarioActual = null;

    window.onload = async function() {
      if(GAS_API_URL.includes("PEGA_AQUI")) return;
      try {
        const config = await fetch(GAS_API_URL + '?action=getConfig').then(r => r.json());
        globalConfig = config;
        if(config.nombre_empresa) document.getElementById('app-title').innerText = config.nombre_empresa;
        
        const catalogos = await fetch(GAS_API_URL + '?action=getCatalogos').then(r => r.json());
        globalCatalogos = catalogos;
      } catch(e) {
        console.error("Error al cargar datos:", e);
      }
    };

    async function handleLogin() {
      const pin = document.getElementById('pin-input').value;
      const btn = document.getElementById('btn-login');
      btn.innerText = 'Verificando...';

      try {
        const res = await fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'login', pin: pin })
        }).then(r => r.json());

        btn.innerText = 'Ingresar';
        if (res.exito) {
          usuarioActual = res.usuario;
          document.getElementById('screen-login').classList.add('hidden');
          document.getElementById('screen-app').classList.remove('hidden');
          agregarFilaMaterial();
        } else {
          document.getElementById('login-error').innerText = res.mensaje;
          document.getElementById('login-error').classList.remove('hidden');
        }
      } catch(e) {
        btn.innerText = 'Ingresar';
        alert("Error al conectar con la base de datos.");
      }
    }

    function agregarFilaMaterial() {
      const container = document.getElementById('lista-materiales');
      let options = '<option value="">Seleccionar material...</option>';
      globalCatalogos.materiales.forEach(m => {
        options += `<option value="${m.id}">${m.nombre} ($${m.precioUnitario})</option>`;
      });

      const div = document.createElement('div');
      div.className = 'grid grid-cols-12 gap-2 items-center bg-slate-50 p-2 rounded-xl text-xs';
      div.innerHTML = `
        <select class="col-span-7 p-2 border rounded-lg bg-white sel-mat" onchange="calcularTotales()">${options}</select>
        <input type="number" placeholder="Mts" class="col-span-3 p-2 border rounded-lg text-center input-cant-mat" oninput="calcularTotales()">
        <button onclick="this.parentElement.remove(); calcularTotales();" class="col-span-2 text-red-500 font-bold text-center"><i class="fa-solid fa-trash"></i></button>
      `;
      container.appendChild(div);
    }

    function calcularTotales() {
      let costoMat = 0;
      document.querySelectorAll('#lista-materiales > div').forEach(f => {
        const idMat = f.querySelector('.sel-mat').value;
        const cantMetros = parseFloat(f.querySelector('.input-cant-mat').value) || 0;
        if (idMat && cantMetros > 0) {
          const item = globalCatalogos.materiales.find(m => m.id === idMat);
          if (item) {
            const tramos = Math.ceil(cantMetros / item.largoTramo);
            costoMat += tramos * item.precioUnitario;
          }
        }
      });
      document.getElementById('lbl-total-cliente').innerText = '$' + (costoMat * 1.35).toFixed(2);
    }

    async function enviarCotizacion() {
      const btn = document.getElementById('btn-guardar');
      btn.innerText = 'Guardando...';
      
      const payload = {
        idTrabajador: usuarioActual.id,
        cliente: {
          nombre: document.getElementById('cli-nombre').value,
          telefono: document.getElementById('cli-tel').value,
          correo: document.getElementById('cli-correo').value,
          tipoProyecto: document.getElementById('cli-proyecto').value
        },
        itemsMateriales: [],
        itemsActividades: [],
        totales: { costoMateriales: 0, costoActividades: 0, costoDirectoTotal: 0, margenGananciaPorcentaje: 35, montoGanancia: 0, subtotalSinImpuesto: 0, impuestoMonto: 0, totalCliente: 0 }
      };

      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'guardarCotizacion', payload: payload })
      }).then(r => r.json());

      if(res.exito) {
        alert('Cotización guardada! Folio: ' + res.folio);
        location.reload();
      } else {
        alert('Error: ' + res.mensaje);
      }
    }
  </script>
</body>
</html>
